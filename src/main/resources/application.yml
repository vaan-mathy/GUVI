server:
  port: 8081

spring:
  application:
    name: mel

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/mel_db}

  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 1000

gateway:
  security:
    jwt-secret: ${JWT_SECRET}
  limits:
    max-tokens: 100.0
    refill-rate-per-second: 1.666